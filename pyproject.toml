[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-mceliece"
version = "1.0.0"
description = "Classic McEliece Post-Quantum Cryptosystem & Hybrid CLI Encryption Tool with GPU (CUDA) Acceleration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Classic McEliece Implementation Team" }
]
keywords = ["post-quantum", "cryptography", "mceliece", "kem", "cuda", "gpu", "nist-pqc", "iso-18033-2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.20",
    "cryptography>=3.4",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
]
test = [
    "pytest>=7.0",
]

[project.scripts]
mceliece = "mceliece_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mceliece*"]
